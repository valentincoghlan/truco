<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Truco · Edición Alemania 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  /* Cámara Insurtech Argentina: azul oscuro y blanco; celestes #0cb7f2 y #0979b0, gris #c6ccd8 */
  color-scheme:dark;
  --bg:#0b2340; --ink:#ffffff; --muted:#b9c6d8; --panel:#12305a; --line:#2a4d7c;
  --stick:#ffffff; --accent:#0cb7f2; --gold:#0cb7f2; --felt:#0979b0; --rim:#071a30; --focus:#0cb7f2; --red:#0cb7f2;
  --plate:#0b2340; --them:#c6ccd8;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh}
.disp{font-family:'Archivo Black',Georgia,'Times New Roman',serif;font-weight:400}
.wrap{max-width:520px;margin:0 auto;padding:12px 12px 28px}
.wrap.busy{pointer-events:none}
.wrap.busy .btn,.wrap.busy .hand .card{opacity:.6}
h1,h2,p{margin:0}
.msg{padding:28px 0;text-align:center;color:var(--muted)}

/* botones */
.btn{font:inherit;font-weight:800;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:12px;padding:10px 14px;min-height:46px;cursor:pointer}
.btn:focus-visible,.card.can:focus-visible,.link:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#0b2340}
.btn.ghost{border-color:var(--line);font-weight:600}
.btn[disabled]{opacity:.4;cursor:default}
.btn.small{min-height:36px;padding:6px 10px;font-size:14px}
.link{font:inherit;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns .btn{flex:1 1 auto}

/* entrada */
.entry{padding-top:28px;display:grid;gap:14px}
.logo{font-size:64px;line-height:1;letter-spacing:.5px}
.entry p{color:var(--muted)}
.brand{display:block;color:#fff}
.brand svg{display:block;height:auto}
.brand.big svg{width:230px}
.brand.small{margin-bottom:10px}
.brand.small svg{width:120px}
.pick h2{font-size:18px}
.people{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 6px}
.person{font:inherit;background:none;border:2px solid transparent;border-radius:14px;padding:6px 2px;color:var(--ink);cursor:pointer;display:grid;justify-items:center;gap:4px;font-size:12px;font-weight:600;line-height:1.15;text-align:center}
.person.on{border-color:var(--accent);background:var(--panel)}
.person:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.av{border-radius:50%;object-fit:cover;flex:none;background:var(--panel);display:inline-grid;place-items:center;font-weight:800;color:var(--ink);border:2px solid #fff;overflow:hidden}
.me{display:flex;align-items:center;gap:12px;padding:10px 12px;border:2px solid var(--line);border-radius:16px;background:var(--panel)}
.me b{display:block;font-size:18px}
.me .link{margin-left:auto}
.slot .who{display:flex;align-items:center;gap:8px;min-width:0}
.plate{display:inline-flex;align-items:center;gap:6px}
.plate .av{border-width:1.5px}
.shout .av{margin-bottom:4px}
.ed{font-size:22px;line-height:1.1;color:var(--red)!important;margin-top:6px}
label{display:grid;gap:6px;font-weight:600;font-size:14px}
input{font:inherit;font-size:18px;padding:11px 12px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);width:100%}
.row{display:flex;gap:8px}
.row input{text-transform:uppercase;letter-spacing:4px;font-weight:800;text-align:center}
.sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}

/* encabezado */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.code{font-size:22px;letter-spacing:3px}
.top .l{display:flex;align-items:center;gap:8px}

/* lobby */
.pairs{display:grid;gap:10px;margin:14px 0}
.pair{border:2px solid var(--line);border-radius:16px;padding:12px;background:var(--panel)}
.pair h2{font-size:18px;margin-bottom:8px}
.slot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px dashed var(--line)}
.slot:first-of-type{border-top:0}
.slot b{font-weight:800}
.slot .empty{color:var(--muted)}
.hint{color:var(--muted);font-size:14px}
.tg{display:flex;gap:8px;align-items:center;margin:6px 0 14px}
.tg .btn.on{background:var(--ink);color:var(--bg)}

/* marcador de fósforos */
.score{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:8px 12px;display:grid;gap:4px;margin-bottom:10px}
.srow{display:grid;grid-template-columns:78px 1fr 34px;align-items:center;gap:8px}
.srow .who{font-weight:800;font-size:14px}
.srow .n{font-family:'Archivo Black',Georgia,serif;font-size:22px;text-align:right}
.sticks{display:flex;flex-wrap:wrap;gap:4px}
.grp line{stroke:var(--stick);stroke-width:3;stroke-linecap:round}
.grp line.off{opacity:.16}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding-top:2px}

/* mesa */
.table{background:var(--felt);border:8px solid var(--rim);border-radius:24px;padding:12px 8px;display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:6px;color:#fff}
.seat{display:flex;flex-direction:column;align-items:center;gap:5px;min-height:76px}
.seat.top{grid-column:1/4}
.seat.left{grid-column:1;grid-row:2}
.seat.right{grid-column:3;grid-row:2}
.seat.bottom{grid-column:1/4;grid-row:3}
.mid{grid-column:2;grid-row:2;display:flex;align-items:center;justify-content:center;text-align:center;min-height:90px}
.plate{max-width:100%;padding:3px 10px;border-radius:999px;font-weight:800;font-size:14px;border:2px solid transparent;background:var(--plate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate.us{border-color:var(--gold)}
.plate.them{border-color:var(--them)}
.plate em{font-style:normal;font-weight:600;font-size:11px;opacity:.8;margin-left:4px}
.seat.turn .plate{background:#fff;color:#0b2340}
.backs{display:flex;gap:3px;min-height:14px}
.backs i{display:block;width:12px;height:18px;border-radius:3px;border:1.5px solid #fff;background:repeating-linear-gradient(45deg,#0b2340 0 4px,#12305a 4px 8px)}
.played{display:flex;min-height:66px}
.played .card+.card{margin-left:-26px}

/* cartas */
.card{--w:88px;width:var(--w);height:calc(var(--w)*1.5);border-radius:calc(var(--w)*.09);background:#fbf3df;border:2px solid #2b2417;position:relative;flex:none;font-family:'Archivo Black',Georgia,serif;color:#222}
.card.sE{color:#2b4f9e}.card.sB{color:#2f6f3d}.card.sO{color:#c98a12}.card.sC{color:#b8322b}
.card .cf{position:absolute;inset:0;width:100%;height:100%}
.card .ct{font-family:'Archivo Black',Georgia,serif;font-size:13px;fill:currentColor}
.card.sm .ct{font-size:16px}
.card.sm{--w:44px;border-width:1.5px}
.hand{display:flex;justify-content:center;gap:10px;margin:14px 0 10px}
.hand .card{cursor:default;opacity:.55}
.hand .card.can{cursor:pointer;opacity:1;border-color:#111}
.hand .card.can:active{transform:translateY(-4px)}
.cardbtn{background:none;border:0;padding:0}

/* cantos y estado */
.shout{padding:6px 4px}
.shout small{display:block;font-size:13px;opacity:.85}
.shout b{font-family:'Archivo Black',Georgia,serif;font-weight:400;font-size:26px;line-height:1.05;display:block}
.shout.pop{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.shout.pop{animation:none}}
.status{margin:10px 0 0;font-weight:800;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.chip{font-size:13px;padding:3px 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel)}
.chip.gold{border-color:var(--gold)}
.panel{margin-top:12px;border:2px solid var(--ink);border-radius:16px;padding:12px;display:grid;gap:10px;background:var(--panel)}
.panel .q{font-size:17px}
.panel .q b.disp{font-weight:400;font-size:20px}
.wait{margin-top:12px;text-align:center;color:var(--muted)}
.over{margin-top:12px;border:2px solid var(--gold);border-radius:16px;padding:14px;text-align:center;display:grid;gap:10px;background:var(--panel)}
.over .disp{font-size:24px;line-height:1.1}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;max-width:90vw;z-index:10}
.ro{margin:10px 0;padding:8px 12px;border-radius:12px;background:var(--panel);border:1.5px dashed var(--line);font-size:14px;color:var(--muted)}
</style>
</head>

function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

var uid=lsGet('truco.uid');
if(!uid){uid='u'+Math.random().toString(36).slice(2)+Date.now().toString(36)+Math.random().toString(36).slice(2);lsSet('truco.uid',uid)}
var name=lsGet('truco.name')||'';
var av=lsGet('truco.av')||'';
/* delegación Edición Alemania 2026 (Bios de la Cámara): id = foto en /fotos/<id>.jpg; un 1 al final = sin foto */
var PEOPLE=[
  ['acevedo','Rafael Acevedo'],['buxdorf','Mariano Buxdorf'],['coghlan','Valentín Coghlan'],['depascual','Gabriel Depascual'],
  ['gaido','Marcos Gaido'],['donemberg','Nadir Donemberg'],['elizalde','Facundo Elizalde'],['axel-garcia','Axel García Giménez'],
  ['ignacio-garcia','Ignacio García Giménez'],['giaquinta','Leandro Giaquinta'],['heinecke','Socorro Heinecke'],['humphreys','Roy Humphreys'],
  ['clarisa-lohning','Clarisa Löhning'],['pablo-lohning','Pablo Löhning'],['malca','Rigoberto Malca La Rosa'],['mandolesi','Juan Ignacio Mandolesi'],
  ['mangupli','Walter Mangupli',1],['rodriguez','Esteban Rodríguez'],['schuartzman','Sebastián Schuartzman'],['stegmann','Ezequiel Stegmann'],
  ['villamea','Maximiliano Villamea'],['yovino','Hugo Yovino']
];
function person(id){for(var i=0;i<PEOPLE.length;i++) if(PEOPLE[i][0]===id) return PEOPLE[i];return null}
var picking=!name;
var ws=null,connected=false,retry=0;
var code=null,st=undefined,mine=null;
var toast='',toastT=null,mazoArmed=false,mazoT=null,shownKey=null,codeInput='';

/* ---------- conexión ---------- */
function send(o){
  if(ws&&ws.readyState===1){ws.send(JSON.stringify(o));return true}
  toast='Sin conexión con el servidor…';render();return false;
}
function hello(){send({t:'hello',uid:uid,name:name.trim(),av:av})}
function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onopen=function(){
    connected=true;retry=0;
    hello();
    var c=code||lsGet('truco.code');
    if(c&&name.trim()) send({t:'join',code:c});
    render();
  };
  ws.onmessage=function(ev){
    var m;try{m=JSON.parse(ev.data)}catch(e){return}
    if(m.t==='state'){code=m.code;lsSet('truco.code',code);st=m.d;mine=m.mine;render()}
    else if(m.t==='err'){
      toast=m.m;
      if(m.gone){code=null;st=undefined;mine=null;lsDel('truco.code')}
      render();
    }
  };
  ws.onclose=function(){connected=false;retry++;render();setTimeout(connect,Math.min(5000,600*retry))};
  ws.onerror=function(){};
}

/* ---------- reglas visibles (solo para mostrar botones) ---------- */
function canTruco(r,seat){return r.trucoLvl<3&&(r.trucoRight===-1||r.trucoRight===seat%2)}
function envOK(r){return r.bazas.length===0&&!r.envidoDone&&r.trucoLvl===0}
function envNext(calls){
  if(!calls.length) return ['E','R','F'];
  var last=calls[calls.length-1],ne=calls.filter(function(k){return k==='E'}).length;
  if(last==='E') return ne<2?['E','R','F']:['R','F'];
  if(last==='R') return ['F'];
  return [];
}
function nm(d,s){return d.seats[s]?d.seats[s].name:'?'}
function teamName(d,t){return d.size===2?nm(d,t):nm(d,t)+' y '+nm(d,t+2)}
/* en mano a mano se habla en singular */
function usThem(d,us){return d.size===2?(us?'Vos':'Rival'):(us?'Nosotros':'Ellos')}

/* ---------- acciones ---------- */
function needName(){
  toast='Poné tu nombre primero';render();
  var i=document.getElementById('nm');if(i)i.focus();
}
function handle(a){
  if(a.indexOf('pick:')===0){
    var p=person(a.slice(5));if(!p) return;
    av=p[0];name=p[1];lsSet('truco.av',av);lsSet('truco.name',name);picking=false;hello();return render();
  }
  if(a==='repick'){picking=true;return render()}
  if(a==='create'){
    if(!name.trim()) return needName();
    lsSet('truco.name',name.trim());hello();return send({t:'create'});
  }
  if(a==='join'){
    if(!name.trim()) return needName();
    var c=(codeInput||'').trim();
    if(c.length<4){toast='El código tiene 4 letras o números';return render()}
    lsSet('truco.name',name.trim());hello();return send({t:'join',code:c});
  }
  if(a==='exit'){code=null;st=undefined;mine=null;lsDel('truco.code');
    // salir de la mesa en el servidor: reconectar limpio
    if(ws){ws.onclose=null;ws.close()}
    connected=false;render();connect();return}
  if(a==='copy'){
    try{navigator.clipboard.writeText(code).then(function(){toast='Código copiado';render()},function(){toast='Código: '+code;render()})}
    catch(e){toast='Código: '+code;render()}
    return;
  }
  if(a.indexOf('sit:')===0){
    if(!name.trim()) return needName();
    hello();return send({t:'sit',s:+a.slice(4)});
  }
  if(a==='stand') return send({t:'stand'});
  if(a==='start') return send({t:'start'});
  if(a.indexOf('size:')===0) return send({t:'size',n:+a.slice(5)});
  if(a.indexOf('target:')===0) return send({t:'target',n:+a.slice(7)});
  if(a==='mazo'){
    if(!mazoArmed){mazoArmed=true;clearTimeout(mazoT);mazoT=setTimeout(function(){mazoArmed=false;render()},3000);return render()}
    mazoArmed=false;return send({t:'act',a:'mazo'});
  }
  send({t:'act',a:a});
}
app.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');
  if(!el||el.hasAttribute('disabled')) return;
  handle(el.getAttribute('data-a'));
});
app.addEventListener('input',function(e){
  if(e.target.id==='nm'){name=e.target.value;if(av){av='';lsDel('truco.av')}}
  if(e.target.id==='cd') codeInput=e.target.value.toUpperCase();
});

/* ---------- vistas ---------- */
function btn(a,label,cls,extra){return '<button class="btn '+(cls||'')+'" data-a="'+a+'" '+(extra||'')+'>'+label+'</button>'}
/* carta en un SVG de 60x90: pintas acomodadas como en la baraja española, figuras para 10, 11 y 12 */
var PALO={E:'espadas',B:'bastos',O:'oros',C:'copas'};
var LAY={1:[[30,46]],2:[[30,26],[30,64]],3:[[30,20],[30,45],[30,70]],4:[[21,27],[39,27],[21,63],[39,63]],
  5:[[21,24],[39,24],[30,45],[21,66],[39,66]],6:[[21,22],[39,22],[21,45],[39,45],[21,68],[39,68]],
  7:[[21,20],[39,20],[30,33],[21,47],[39,47],[21,70],[39,70]]};
var ROUND={1:30,2:22,3:19,4:18,5:15,6:15,7:13};
var TALL={1:[24,50],2:[17,34],3:[13,25],4:[15,31],5:[11,21],6:[11,21],7:[9,15]};
var FIGPIP={10:[44,44,12],11:[46,30,12],12:[45,49,12]};
function pip(s,x,y,w,h){return '<use href="#p'+s+'" x="'+(x-w/2)+'" y="'+(y-h/2)+'" width="'+w+'" height="'+h+'"/>'}
function cardHTML(c,cls,attrs){
  var n=parseInt(c,10),s=c.slice(-1),tall=s==='E'||s==='B',g='';
  if(n>=10){
    var f=FIGPIP[n],fw=tall?f[2]*.75:f[2],fh=tall?f[2]*1.7:f[2];
    g='<use href="#f'+n+'" x="10" y="17" width="38" height="57"/>'+pip(s,f[0],f[1],fw,fh);
  }else{
    LAY[n].forEach(function(p){g+=tall?pip(s,p[0],p[1],TALL[n][0],TALL[n][1]):pip(s,p[0],p[1],ROUND[n],ROUND[n])});
  }
  var num='<text class="ct" x="4" y="13">'+n+'</text><text class="ct" x="4" y="13" transform="rotate(180 30 45)">'+n+'</text>';
  return '<div class="card s'+s+' '+(cls||'')+'" '+(attrs||'')+'><svg class="cf" viewBox="0 0 60 90" aria-hidden="true">'+g+num+'</svg></div>';
}
function sticks(n,groups){
  var segs=[[4,4,24,4],[24,4,24,24],[24,24,4,24],[4,24,4,4],[4,24,24,4]],out='';
  for(var g=0;g<groups;g++){
    var k=Math.max(0,Math.min(5,n-g*5));
    out+='<svg class="grp" viewBox="0 0 28 28" width="28" height="28" aria-hidden="true">'+segs.map(function(s,i){
      return '<line class="'+(i<k?'on':'off')+'" x1="'+s[0]+'" y1="'+s[1]+'" x2="'+s[2]+'" y2="'+s[3]+'"/>';
    }).join('')+'</svg>';
  }
  return out;
}
var LOGO='<svg viewBox="0 0 400.23 143.14" role="img" aria-label="Cámara Insurtech Argentina"><use href="#logoCIA"/></svg>';
function header(){
  return '<span class="brand small">'+LOGO+'</span><div class="top"><div class="l"><span class="disp code">'+esc(code||'')+'</span>'+(code?btn('copy','Copiar código','ghost small'):'')+'</div><div>'+btn('exit','Salir','ghost small')+'</div></div>';
}
/* foto si la persona tiene, si no iniciales */
function avatar(id,nameTxt,size){
  var p=person(id),st='width:'+size+'px;height:'+size+'px;font-size:'+Math.round(size*.38)+'px';
  if(p&&!p[2]) return '<img class="av" src="/fotos/'+p[0]+'.jpg" alt="" width="'+size+'" height="'+size+'" style="'+st+'" loading="lazy">';
  var ini=String(nameTxt||'?').trim().split(/\s+/).slice(0,2).map(function(w){return w.charAt(0)}).join('').toUpperCase();
  return '<span class="av" style="'+st+'" aria-hidden="true">'+esc(ini)+'</span>';
}
function pickerHTML(){
  if(!picking&&name.trim()){
    return '<div class="me">'+avatar(av,name,48)+'<div><small class="hint">Jugás como</small><b>'+esc(name)+'</b></div><button class="link" data-a="repick">Cambiar</button></div>';
  }
  return '<div class="pick"><h2 class="disp">Elegí tu jugador</h2></div>'+
    '<div class="people">'+PEOPLE.map(function(p){
      return '<button class="person'+(p[0]===av?' on':'')+'" data-a="pick:'+p[0]+'" aria-pressed="'+(p[0]===av)+'">'+avatar(p[0],p[1],56)+'<span>'+esc(p[1])+'</span></button>';
    }).join('')+'</div>'+
    '<label>O escribí tu nombre<input id="nm" maxlength="24" autocomplete="nickname" value="'+esc(av?'':name)+'" placeholder="Ej: Valen"></label>';
}
function entryHTML(){
  return '<div class="entry"><span class="brand big">'+LOGO+'</span>'+
  '<div><h1 class="disp logo">Truco</h1><p class="disp ed">Edición Alemania 2026</p></div>'+
  '<p>Mano a mano o de a cuatro en parejas, cada uno desde su celu.</p>'+
  pickerHTML()+
  btn('create','Crear mesa','primary')+
  '<div class="sep">o entrá a una mesa</div>'+
  '<div class="row"><input id="cd" maxlength="4" placeholder="CÓDIGO" value="'+esc(codeInput)+'" aria-label="Código de mesa">'+btn('join','Entrar','')+'</div>'+
  '</div>';
}
function lobbyHTML(d){
  var n=Object.keys(d.seats).length,h=header(),two=d.size===2;
  function slot(s){
    var p=d.seats[s];
    if(p) return '<div class="slot"><span class="who">'+avatar(p.av,p.name,32)+'<b>'+esc(p.name)+(s===mine?' (vos)':'')+'</b></span>'+(s===mine?btn('stand','Levantarme','ghost small'):'')+'</div>';
    return '<div class="slot"><span class="empty">Libre</span>'+btn('sit:'+s,'Sentarme','small')+'</div>';
  }
  h+='<h2 class="disp" style="font-size:26px;margin-top:6px">Armando la mesa</h2>';
  h+='<p class="hint">'+(two?'Compartí el código '+esc(code)+' con tu rival.':'Compartí el código '+esc(code)+' con los otros tres. Los compañeros van en la misma pareja.')+'</p>';
  h+='<div class="tg"><span>Jugadores</span>'+btn('size:2','2','small '+(two?'on':''))+btn('size:4','4','small '+(!two?'on':''))+'</div>';
  if(two) h+='<div class="pairs"><div class="pair"><h2 class="disp">Jugador A</h2>'+slot(0)+'</div><div class="pair"><h2 class="disp">Jugador B</h2>'+slot(1)+'</div></div>';
  else h+='<div class="pairs"><div class="pair"><h2 class="disp">Pareja A</h2>'+slot(0)+slot(2)+'</div><div class="pair"><h2 class="disp">Pareja B</h2>'+slot(1)+slot(3)+'</div></div>';
  h+='<div class="tg"><span>Se juega a</span>'+btn('target:15','15','small '+(d.target===15?'on':''))+btn('target:30','30','small '+(d.target===30?'on':''))+'<span>puntos</span></div>';
  h+=btn('start',n<d.size?'Faltan '+(d.size-n)+' para empezar':'Empezar','primary',(n<d.size||mine===null)?'disabled':'');
  return h;
}
function scoreHTML(d,myT){
  var groups=d.target/5;
  function row(t){
    var label=usThem(d,t===myT);
    if(mine===null) label=(d.size===2?'Jugador ':'Pareja ')+(t===0?'A':'B');
    return '<div class="srow"><span class="who">'+label+'</span><div class="sticks">'+sticks(d.score[t],groups)+'</div><span class="n">'+d.score[t]+'</span></div>';
  }
  var r=d.round,lvl=r&&!r.over?POINTS[r.trucoLvl]:null;
  return '<div class="score">'+row(myT)+row(1-myT)+'<div class="meta"><span>A '+d.target+'</span><span>'+(lvl?'La mano vale '+lvl+(r.trucoLvl?' · '+TRUCO[r.trucoLvl]:''):'')+'</span></div></div>';
}
function seatHTML(d,s,pos,myT){
  var r=d.round,p=d.seats[s];
  var turn=!r.over&&!r.ask&&r.turn===s&&d.status==='playing';
  var cls=(s%2===myT)?'us':'them',backs='';
  if(pos!=='bottom'){for(var i=0;i<r.hands[s].length;i++) backs+='<i></i>'}
  return '<div class="seat '+pos+(turn?' turn':'')+'"><div class="plate '+cls+'">'+avatar(p.av,p.name,22)+'<span>'+esc(p.name)+'</span>'+(r.mano===s?'<em>mano</em>':'')+(p.on===false?'<em>sin conexión</em>':'')+'</div>'+
    (pos!=='bottom'?'<div class="backs">'+backs+'</div>':'')+
    '<div class="played">'+r.played[s].map(function(c){return cardHTML(c,'sm')}).join('')+'</div></div>';
}
function statusText(d){
  var r=d.round;
  if(d.status==='finished') return 'Partida terminada';
  if(r.over) return 'Terminó la mano';
  if(r.ask){
    var rt=1-r.ask.by%2;
    if(mine!==null) return mine%2===rt?'Tenés que responder':'Esperando a '+teamName(d,rt);
    return 'Esperando respuesta';
  }
  if(mine!==null&&r.turn===mine) return 'Te toca jugar';
  return 'Juega '+nm(d,r.turn);
}
function askLabel(a){
  if(a.kind==='truco') return '¡'+TRUCO[a.lvl]+'!';
  return a.calls.map(function(k){return ENV[k]}).join(', ');
}
function actionsHTML(d){
  var r=d.round;
  if(mine===null||d.status!=='playing'||r.over) return '';
  var myT=mine%2,h='';
  if(r.ask){
    var a=r.ask,rt=1-a.by%2;
    if(myT!==rt) return '<div class="wait">Esperando respuesta…</div>';
    h='<div class="panel"><div class="q"><b>'+esc(nm(d,a.by))+'</b> cantó <b class="disp">'+esc(askLabel(a))+'</b></div><div class="btns">'+btn('quiero','Quiero','primary')+btn('no','No quiero','');
    if(a.kind==='truco'){
      if(a.lvl<3) h+=btn('up','¡'+TRUCO[a.lvl+1]+'!','accent');
      if(a.lvl===1&&envOK(r)) envNext([]).forEach(function(k){h+=btn('env:'+k,ENV[k],'accent')});
    }else{
      envNext(a.calls).forEach(function(k){h+=btn('env:'+k,ENV[k],'accent')});
    }
    return h+'</div></div>';
  }
  if(r.turn!==mine) return '';
  h='<div class="btns" style="margin-top:12px">';
  if(canTruco(r,mine)) h+=btn('truco','¡'+TRUCO[r.trucoLvl+1]+'!','accent');
  if(envOK(r)) envNext([]).forEach(function(k){h+=btn('call:'+k,ENV[k],'')});
  h+=btn('mazo',mazoArmed?'¿Seguro? Tocá de nuevo':'Al mazo','ghost');
  return h+'</div>';
}
function gameHTML(d){
  var r=d.round,myT=mine===null?0:mine%2,base=mine===null?0:mine;
  var h=header();
  h+=scoreHTML(d,myT);
  var pos=d.size===2?{bottom:base,top:1-base}:{bottom:base%4,right:(base+1)%4,top:(base+2)%4,left:(base+3)%4};
  var last=null;
  for(var i=(d.log||[]).length-1;i>=0;i--){if(d.log[i].s>=0){last=d.log[i];break}}
  var shout='';
  if(last){
    var pop=last.k!==shownKey;shownKey=last.k;
    var sp=d.seats[last.s]||{};
    shout='<div class="shout'+(pop?' pop':'')+'">'+avatar(sp.av,sp.name,36)+'<small>'+esc(nm(d,last.s))+'</small><b>'+esc(last.t)+'</b></div>';
  }
  var side=function(p){return pos[p]===undefined?'':seatHTML(d,pos[p],p,myT)};
  h+='<div class="table">'+side('top')+side('left')+'<div class="mid">'+shout+'</div>'+side('right')+side('bottom')+'</div>';
  h+='<p class="status">'+statusText(d)+'</p>';
  var chips='';
  if(r.bazas.length){
    chips+=r.bazas.map(function(w,i){return '<span class="chip">Baza '+(i+1)+': '+(w===-1?'parda':(mine===null?(w===0?'Pareja A':'Pareja B'):(w===myT?(d.size===2?'tuya':'nuestra'):(d.size===2?'del rival':'de ellos'))))+'</span>'}).join('');
  }
  if(r.envidoRes){
    var er=r.envidoRes,t;
    if(er.q){
      var us=mine===null?er.e[0]:er.e[myT],them=mine===null?er.e[1]:er.e[1-myT];
      t='Envido '+us+' a '+them;
    }else t='Envido no querido';
    chips+='<span class="chip gold">'+t+' · +'+er.pts+'</span>';
  }
  if(chips) h+='<div class="chips">'+chips+'</div>';
  if(d.status==='finished'){
    var wn=d.winner,ws2=mine===null?teamName(d,wn):(d.size===2?(wn===myT?'¡Ganaste!':'Ganó '+nm(d,wn)):(wn===myT?'¡Ganamos!':'Ganaron ellos'));
    h+='<div class="over"><div class="disp">'+esc(ws2)+'</div><p class="hint">'+esc(teamName(d,wn))+'</p>'+(mine!==null?btn('rematch','Revancha','primary'):'')+'</div>';
  }else if(r.over){
    var who=mine===null?teamName(d,r.over.team):usThem(d,r.over.team===myT);
    h+='<div class="over"><div class="disp">'+esc(who)+' +'+r.over.pts+'</div><p class="hint">'+esc(r.over.t)+'</p>'+(mine!==null?btn('next','Repartir la siguiente','primary'):'')+'</div>';
  }
  h+=actionsHTML(d);
  if(mine!==null&&d.status==='playing'){
    var can=!r.over&&!r.ask&&r.turn===mine;
    h+='<div class="hand">'+r.hands[mine].map(function(c){
      return can?'<button class="cardbtn" data-a="play:'+c+'" aria-label="Jugar '+parseInt(c,10)+' de '+PALO[c.slice(-1)]+'">'+cardHTML(c,'can')+'</button>':cardHTML(c,'');
    }).join('')+'</div>';
  }
  if(mine===null) h+='<p class="hint" style="text-align:center;margin-top:12px">Estás mirando la partida.</p>';
  return h;
}
function render(){
  var h;
  if(!connected) h=(code?header():'')+'<p class="msg">Conectando con el servidor…<br><small>Si recién se despertó, puede tardar hasta un minuto.</small></p>';
  else if(!code||st===undefined) h=entryHTML();
  else if(st.status==='lobby') h=lobbyHTML(st);
  else h=gameHTML(st);
  app.innerHTML='<div class="wrap">'+h+'</div>'+(toast?'<div class="toast" role="status">'+esc(toast)+'</div>':'');
  if(toast){clearTimeout(toastT);toastT=setTimeout(function(){toast='';var t=document.querySelector('.toast');if(t)t.remove()},3200)}
}
render();connect();
})();

</script>
</body>
</html>
